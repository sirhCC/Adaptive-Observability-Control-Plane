[mypy]
# Strict type checking configuration for Adaptive Observability Control Plane

# === Strict Mode ===
# Enable most strict checks (but we'll configure some individually for flexibility)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
strict_concatenate = True

# === Type Checking Strictness ===
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = False
check_untyped_defs = True
disallow_any_generics = True

# === None/Optional Handling ===
no_implicit_optional = True
strict_optional = True

# === Error Reporting ===
show_error_codes = True
show_error_context = True
show_column_numbers = True
pretty = True
color_output = True
error_summary = True

# === Miscellaneous ===
no_implicit_reexport = True
namespace_packages = True

# === Python Version ===
python_version = 3.13

# === Paths ===
mypy_path = control_plane
files = control_plane, tests
exclude = .*\.json$

# === Third-Party Library Ignores ===
# Some libraries don't have type stubs, so we ignore them

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-loguru.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-prometheus_fastapi_instrumentator.*]
ignore_missing_imports = True

[mypy-launchdarkly.*]
ignore_missing_imports = True

[mypy-splitio.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-faker.*]
ignore_missing_imports = True

[mypy-ldclient.*]
ignore_missing_imports = True

# === Gradual Typing Strategy ===
# Allow some flexibility for existing code while we add type hints

[mypy-control_plane.main]
# Main file is large, be slightly more lenient during transition
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-control_plane.models]
# SQLAlchemy models have special typing requirements
disallow_any_generics = False
disallow_untyped_defs = False

[mypy-control_plane.repository]
# Repository has SQLAlchemy-specific patterns
disallow_any_generics = False
disallow_untyped_defs = False

[mypy-control_plane.feature_flags]
# Feature flag providers have optional dependencies
disallow_untyped_defs = False

[mypy-tests.*]
# Tests can be less strict
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
